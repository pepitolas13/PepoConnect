name: pepo_native
description: PepoConnect fast lane. Builds and bundles the Rust bulk transfer engine (rust/) for Android, iOS, Linux and Windows; pepo_core loads it with dart:ffi.
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
