[package]
name = "pepo_native"
version = "0.3.0"
edition = "2021"
description = "PepoConnect fast lane: encrypted bulk file transfer over TCP (AES-256-GCM, xxh3), driven from Dart over FFI."
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
getrandom = "0.2"
allo-isolate = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
