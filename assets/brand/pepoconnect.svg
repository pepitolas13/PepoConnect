<?xml version="1.0" encoding="UTF-8"?>
<!-- PepoConnect mark: two photo frames linked like chain links. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#0A3D8F"/>
      <stop offset="1" stop-color="#12B6D9"/>
    </linearGradient>
    <!-- Upper-right crossing: the back frame passes over the front one. -->
    <clipPath id="crossing">
      <rect x="296" y="178" width="58" height="58"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Back frame with a check -->
  <rect x="112" y="128" width="220" height="176" rx="30" fill="none" stroke="#FFFFFF" stroke-width="28"/>
  <path d="M150 165 L166 181 L194 151" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front frame with a mountain and an amber sun -->
  <rect x="196" y="200" width="220" height="176" rx="30" fill="none" stroke="#FFFFFF" stroke-width="28"/>

  <!-- Repaint the crossing: background gradient first (wider, leaves a gap), then the white stroke -->
  <g clip-path="url(#crossing)">
    <rect x="112" y="128" width="220" height="176" rx="30" fill="none" stroke="url(#bg)" stroke-width="40"/>
    <rect x="112" y="128" width="220" height="176" rx="30" fill="none" stroke="#FFFFFF" stroke-width="28"/>
  </g>

  <path d="M224 346 L286 262 L322 300 L352 272 L388 346 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="372" cy="244" r="16" fill="#FFC857"/>
</svg>
