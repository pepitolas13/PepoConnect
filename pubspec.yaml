name: pepoconnect
description: "PepoConnect: fotos y archivos entre el movil y el PC, al instante."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  battery_plus: ^7.1.1
  bonsoir: ^7.1.5
  connectivity_plus: ^7.3.1
  desktop_drop: ^0.8.4
  device_info_plus: ^13.2.0
  file_picker: ^13.1.0
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_acrylic: ^1.1.4
  flutter_displaymode: ^0.7.0
  flutter_foreground_task: ^11.0.3
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  local_notifier: ^0.1.6
  logging: ^1.3.0
  mobile_scanner: ^7.4.2
  network_info_plus: ^8.2.1
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pepo_core:
    path: packages/pepo_core
  photo_manager: ^3.12.0
  photo_view: ^0.15.0
  qr_flutter: ^4.1.0
  share_handler: ^0.0.25
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  wakelock_plus: ^1.8.0
  win32_registry: ^3.0.3
  window_manager: ^0.5.2
  windows_single_instance: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/icon/
    - assets/web/

