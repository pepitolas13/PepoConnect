name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows: { type: boolean, default: true, description: "Windows" }
      linux: { type: boolean, default: true, description: "Linux x64 + arm64" }
      android: { type: boolean, default: true, description: "Android" }
      ios: { type: boolean, default: true, description: "iOS" }
env:
  FLUTTER_VERSION: "3.47.4"
jobs:
  check:
    uses: ./.github/workflows/ci.yml

  windows:
    if: github.event_name == 'push' || inputs.windows
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "3.47.4", cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            windows-launcher
            packages/pepo_native/rust
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          ./packaging/windows/prepare-bundle.ps1
          cargo build --release --manifest-path windows-launcher/Cargo.toml
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item windows-launcher/target/release/PepoConnect.exe dist/PepoConnect-win-x64.exe
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/PepoConnect-win-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    if: github.event_name == 'push' || inputs.linux
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x64,   aiarch: x86_64,  fparch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, aiarch: aarch64, fparch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev libnotify-dev flatpak flatpak-builder file
      - uses: actions/cache@v4
        id: sdk
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
      - if: steps.sdk.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git ~/flutter
      - run: echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/pepo_native/rust }
      - run: flutter --version && flutter config --no-analytics && flutter pub get
      - run: flutter build linux --release
      - run: bash packaging/linux/make-tarball.sh ${{ matrix.arch }}
      - run: bash packaging/linux/make-appimage.sh ${{ matrix.arch }} ${{ matrix.aiarch }}
      - run: bash packaging/linux/make-flatpak.sh ${{ matrix.arch }} ${{ matrix.fparch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  android:
    if: github.event_name == 'push' || inputs.android
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "3.47.4", cache: true }
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/pepo_native/rust }
      - name: NDK required by Flutter
        run: |
          NDK=$(grep -oE 'ndkVersion[^"]*"[0-9.]+"' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" | grep -oE '[0-9][0-9.]+')
          echo "NDK $NDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" > /dev/null
      - name: Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_ALIAS }}" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
      - name: Require a stable signing identity for published updates
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Published APK updates require ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. A new debug key would prevent existing users from updating."
          exit 1
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release --target-platform android-arm,android-arm64
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/PepoConnect-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/PepoConnect-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk       dist/PepoConnect-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk             dist/PepoConnect-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    if: github.event_name == 'push' || inputs.ios
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.IOS_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "3.47.4", cache: true }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/pepo_native/rust }
      - name: Newest Xcode on the runner (plugins use the iOS 18.4+ SDK)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          xcodebuild -version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p Payload dist
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr dist/PepoConnect-ios-unsigned.ipa Payload
      - if: env.HAS_CERT == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KC_PW: ${{ github.run_id }}
        run: bash packaging/ios/sign-and-export.sh && cp build/ios/ipa/*.ipa dist/PepoConnect-ios-signed.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  release:
    needs: [windows, linux, android, ios]
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Require every supported package and generate update checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for asset in PepoConnect-win-x64.exe PepoConnect-win-x64-portable.zip \
            PepoConnect-linux-{x64,arm64}.{tar.gz,AppImage,flatpak} \
            PepoConnect-android-{arm64-v8a,armeabi-v7a,x86_64,universal}.apk \
            PepoConnect-ios-unsigned.ipa; do
            test -s "$asset" || { echo "::error::Missing update package: $asset"; exit 1; }
          done
          sha256sum PepoConnect-* > SHA256SUMS.txt
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            cp "$notes" .release-notes.md
          else
            printf 'Descarga el paquete de tu sistema. Encontrarás las instrucciones y los cambios en el [repositorio](https://github.com/pepitolas13/PepoConnect).\n' > .release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: .release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
