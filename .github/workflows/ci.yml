name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - run: flutter --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/pepo_native/rust }
      - name: Rust fast lane (build + tests)
        working-directory: packages/pepo_native/rust
        run: |
          cargo build --release
          cargo test --release
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test packages/pepo_core packages/pepo_native/lib
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: pepo_core analyze and tests (TLS and fast lane)
        working-directory: packages/pepo_core
        env:
          PEPO_NATIVE_LIB: ${{ github.workspace }}/packages/pepo_native/rust/target/release/libpepo_native.so
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --exclude-tags perf
