name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test packages/pepo_core
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: pepo_core analyze and tests
        working-directory: packages/pepo_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --exclude-tags perf
