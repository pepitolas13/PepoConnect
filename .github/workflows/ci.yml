name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      skip_ios:
        type: boolean
        default: false
        description: "Skip the iOS compile job (for callers that build iOS themselves)"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Release package validation tests
        run: python3 -m unittest discover -s tool -p test_verify_release.py -v
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - run: flutter --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/pepo_native/rust }
      - name: Rust fast lane (build + tests)
        working-directory: packages/pepo_native/rust
        run: |
          cargo build --release
          cargo test --release
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test packages/pepo_core packages/pepo_native/lib
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: pepo_core analyze and tests (TLS and fast lane)
        working-directory: packages/pepo_core
        env:
          PEPO_NATIVE_LIB: ${{ github.workspace }}/packages/pepo_native/rust/target/release/libpepo_native.so
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --exclude-tags perf

  # The Swift side (the background keep-alive engine) is only ever compiled
  # here: there is no macOS in the development setup, so without this a build
  # error would not show up until a release tag.
  ios:
    # Phrased as a skip because Actions casts types to numbers before
    # comparing, so `inputs.ios == null` is also true for `false` and the
    # guard never fired. `!null` and `!false` are both true; only an explicit
    # `skip_ios: true` turns it off.
    if: ${{ !inputs.skip_ios }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/pepo_native/rust }
      - name: Newest Xcode on the runner (plugins use the iOS 18.4+ SDK)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          xcodebuild -version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: The background keys have to survive into the bundle
        run: |
          set -eu
          plist=build/ios/iphoneos/Runner.app/Info.plist
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          read_key UIBackgroundModes | grep -q audio
          read_key BGTaskSchedulerPermittedIdentifiers | grep -q org.pepoconnect.app.sync
          read_key NSBonjourServices | grep -q _pepoconnect._tcp
